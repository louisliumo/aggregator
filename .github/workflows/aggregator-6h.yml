name: Aggregator-6h
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
concurrency:
  group: aggregator-6h
  cancel-in-progress: false
env:
  TZ: Asia/Tokyo
  GIST_PAT: ${{ secrets.GIST_PAT }}
  GIST_LINK: ${{ secrets.GIST_LINK }}
  CUSTOMIZE_LINK: ${{ secrets.CUSTOMIZE_LINK }}
  ENABLE_SPECIAL_PROTOCOLS: "true"
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Check secrets
        run: |
          [ -n "$GIST_PAT" ] || { echo "::error::Secret GIST_PAT is empty"; exit 1; }
          [ -n "$GIST_LINK" ] || { echo "::error::Secret GIST_LINK is empty, format username/gist_id"; exit 1; }
          echo "$GIST_LINK" | grep -Eq '^[^/]+/[^/]+$' || { echo "::error::GIST_LINK must be username/gist_id"; exit 1; }
      - name: Collect, dedupe and alive-check
        run: python -u subscribe/collect.py --all --overwrite -t clash v2ray singbox
      - run: date "+%Y-%m-%d %H:%M:%S %Z"
